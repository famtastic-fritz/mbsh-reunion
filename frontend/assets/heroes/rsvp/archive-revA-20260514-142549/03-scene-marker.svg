<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-labelledby="title desc">
  <title id="title">Scene II — Lock Your Seat</title>
  <desc id="desc">Dark velvet and brass movie-scene marker plaque reading Scene II, Interior Auditorium, Night, Lock Your Seat.</desc>
  <defs>
    <radialGradient id="panelGlow" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#4A0E11"/>
      <stop offset="54%" stop-color="#1C0709"/>
      <stop offset="100%" stop-color="#0A0507"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7D5A22"/>
      <stop offset="28%" stop-color="#E8C77A"/>
      <stop offset="54%" stop-color="#C8A45C"/>
      <stop offset="78%" stop-color="#FFF0A8"/>
      <stop offset="100%" stop-color="#8B6728"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#E8C77A" flood-opacity="0.15"/>
    </filter>
    <filter id="bulbGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="18" y="18" width="444" height="164" rx="20" fill="url(#panelGlow)" stroke="url(#brass)" stroke-width="5" filter="url(#softShadow)"/>
  <rect x="31" y="31" width="418" height="138" rx="14" fill="none" stroke="#C8A45C" stroke-width="1.5" opacity="0.55"/>
  <rect x="40" y="40" width="400" height="120" rx="9" fill="#050203" opacity="0.24"/>

  <g filter="url(#bulbGlow)">
    <circle cx="70" cy="34" r="4" fill="#F8D884"/>
    <circle cx="112" cy="34" r="4" fill="#C8A45C" opacity="0.78"/>
    <circle cx="154" cy="34" r="4" fill="#F8D884"/>
    <circle cx="196" cy="34" r="4" fill="#C8A45C" opacity="0.78"/>
    <circle cx="238" cy="34" r="4" fill="#F8D884"/>
    <circle cx="280" cy="34" r="4" fill="#C8A45C" opacity="0.78"/>
    <circle cx="322" cy="34" r="4" fill="#F8D884"/>
    <circle cx="364" cy="34" r="4" fill="#C8A45C" opacity="0.78"/>
    <circle cx="406" cy="34" r="4" fill="#F8D884"/>
  </g>

  <g fill="none" stroke="url(#brass)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M58 61 L82 49 L106 61"/>
    <path d="M374 61 L398 49 L422 61"/>
    <path d="M58 139 L82 151 L106 139"/>
    <path d="M374 139 L398 151 L422 139"/>
  </g>

  <text x="240" y="78" text-anchor="middle"
        font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="16" letter-spacing="1.1" fill="#C8A45C">
    SCENE II · INT. AUDITORIUM — NIGHT
  </text>
  <text x="240" y="130" text-anchor="middle"
        font-family="Playfair Display, Georgia, 'Times New Roman', serif"
        font-size="43" font-weight="700" letter-spacing="1.4" fill="#E8C77A">
    LOCK YOUR SEAT
  </text>
</svg>
