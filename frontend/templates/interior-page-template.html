<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <title>{{PAGE_TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,700;1,400&family=Allura&family=Great+Vibes&family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/sections.css">
  <link rel="stylesheet" href="/css/chatbot.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/premiere.css">
  <link rel="stylesheet" href="/css/cinematic-system.css?v=cinematic6">
  {{OPTIONAL_PAGE_CSS}}
</head>
<body data-page="{{PAGE_KEY}}" data-premiere="on">
  <section class="page-header{{OPTIONAL_HEADER_MODIFIER}}" data-template="header">

    <h1 class="page-header__title{{OPTIONAL_TITLE_MODIFIER}}">{{PAGE_HEADING}}</h1>
    <p class="page-header__sub{{OPTIONAL_SUB_MODIFIER}}">{{PAGE_SUBHEAD}}</p>
  </section>

  {{PAGE_CONTENT}}
<div class="chatbot" id="chatbot" aria-label="Hi-Tide Harry chat">
    <button class="chatbot__bubble" id="chatbot-toggle" type="button" aria-expanded="false" aria-label="Open Hi-Tide Harry chat">
      <img src="/assets/mascot/06-listening.png" alt="" width="64" height="64" aria-hidden="true">
    </button>
    <div class="chatbot__panel" id="chatbot-panel" hidden>
      <header class="chatbot__panel-header">
        <img class="chatbot__panel-pose" src="/assets/mascot/01-wave-hello.png" alt="" width="120" height="120" aria-hidden="true">
        <div class="chatbot__panel-title"><strong>Hi-Tide Harry</strong><span>Reunion Assistant</span></div>
        <button class="chatbot__close" id="chatbot-close" type="button" aria-label="Close chat">×</button>
      </header>
      <ul class="chatbot__messages" id="chatbot-messages" aria-live="polite"></ul>
      <form class="chatbot__input" id="chatbot-form">
        <input type="text" id="chatbot-input" placeholder="Ask Harry about the reunion…" aria-label="Type your question" autocomplete="off">
        <button type="submit" aria-label="Send">→</button>
      </form>
    </div>
  </div>

  <footer class="footer" data-template="footer"></footer>

  <script src="js/config.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="/js/cinematic-shell.js?v=cinematic6" defer></script>
  <script src="/js/analytics.js?v=ga1" defer></script>
  {{OPTIONAL_PAGE_JS}}
  <script src="js/chatbot.js" defer></script>
  <script src="js/page-sequence.js" defer></script>
  <script src="js/premiere.js" defer></script>
</body>
</html>
