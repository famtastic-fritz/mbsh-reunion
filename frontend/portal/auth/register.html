<!doctype html>
<html lang="en">
  <head>
    <base href="/portal/auth/" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#080607" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Create account · My Reunion</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Cormorant+Garamond:ital,wght@0,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="../css/portal.css" />
    <link rel="stylesheet" href="../css/mobile-hardening.css?v=1" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-art auth-art--register">
        <a href="../../index.html" class="portal-brand"
          ><img
            src="../../assets/brand-mark/brand-mark.png"
            alt=""
            width="48"
            height="48"
          /><span
            ><strong>Class of 1996</strong
            ><small>30th Reunion · Private portal</small></span
          ></a
        >
        <div>
          <p class="eyebrow">One profile. The whole experience.</p>
          <h1>Claim your place in the story.</h1>
          <p>
            Create one account for your reservation, ticket, uploads,
            preferences, and future class updates.
          </p>
        </div>
        <img
          class="auth-harry"
          src="../../assets/mascot/13-ticket-stub.png"
          alt="Hi-Tide Harry presents a reunion ticket"
        />
      </section>
      <section class="auth-panel">
        <div class="auth-card">
          <p class="eyebrow">Attendee account</p>
          <h2>Create your account</h2>
          <form data-auth-form="register">
            <div class="field-grid">
              <label
                >First name<input
                  name="first_name"
                  type="text"
                  maxlength="100"
                  autocomplete="given-name"
                  required /></label
              ><label
                >Last name<input
                  name="last_name"
                  type="text"
                  maxlength="100"
                  autocomplete="family-name"
                  required
              /></label>
            </div>
            <label
              >Email address<input
                name="email"
                type="email"
                autocomplete="email"
                required /></label
            ><label
              >Create password<input
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="12"
                maxlength="1024"
                pattern="(?=.*[A-Za-z])(?=.*[0-9]).{12,}"
                required
              /><small
                >Use at least 12 characters with a letter and number.</small
              ></label
            ><label class="check"
              ><input type="checkbox" required /><span
                >I agree to the portal terms and privacy notice.</span
              ></label
            ><button class="button button--primary" type="submit">
              Create &amp; verify account
            </button>
          </form>
          <p class="auth-switch">
            Already registered? <a href="/portal/login">Sign in</a>
          </p>
        </div>
      </section>
    </main>
    <div class="toast" role="status" aria-live="polite" hidden></div>
    <script src="../js/portal-config.js" defer></script>
    <script src="../js/portal-api.js" defer></script>
    <script src="../js/portal.js" defer></script>
  </body>
</html>
