<!doctype html>
<html lang="en">
  <head>
    <base href="/portal/auth/" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#080607" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Choose a new password · My Reunion</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="../css/portal.css" />
    <link rel="stylesheet" href="../css/mobile-hardening.css?v=1" />
  </head>
  <body class="auth-page auth-page--center">
    <main class="auth-card auth-card--standalone">
      <img
        class="auth-medallion"
        src="../../assets/mascot/07-confirming.png"
        alt="Hi-Tide Harry confirms the secure reset"
      />
      <p class="eyebrow">Secure account recovery</p>
      <h1>Choose a new password.</h1>
      <form data-auth-form="reset">
        <label
          >New password<input
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="12"
            maxlength="1024"
            pattern="(?=.*[A-Za-z])(?=.*[0-9]).{12,}"
            required
          /><small
            >At least 12 characters with a letter and number.</small
          ></label
        ><button class="button button--primary" type="submit">
          Update password
        </button>
      </form>
    </main>
    <div class="toast" role="status" aria-live="polite" hidden></div>
    <script src="../js/portal-config.js" defer></script>
    <script src="../js/portal-api.js" defer></script>
    <script src="../js/portal.js" defer></script>
