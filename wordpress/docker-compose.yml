services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    ports:
      - "${WP_DB_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: ${WP_DB_NAME:-mbsh_reunion}
      MARIADB_USER: ${WP_DB_USER:-mbsh_local}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD:-change-local-only}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:-change-root-local-only}
    volumes:
      - mbsh_wp_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:7.0.4-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8096}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-mbsh_reunion}
      WORDPRESS_DB_USER: ${WP_DB_USER:-mbsh_local}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-change-local-only}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISABLE_WP_CRON', true);
        define('FAMTASTIC_REUNION_MODE', 'proof');
        define('FAMTASTIC_FRONTEND_URL', '${FAMTASTIC_FRONTEND_URL:-http://127.0.0.1:8952}');
        define('FAMTASTIC_RESEND_API_KEY', '${RESEND_API_KEY:-}');
        define('FAMTASTIC_RESEND_FROM', '${RESEND_FROM_COMMITTEE:-committee@send.mbsh96reunion.com}');
        define('FAMTASTIC_RESEND_REPLY_TO', '${RESEND_REPLY_TO:-committee@mbsh96reunion.com}');
    volumes:
      - mbsh_wp_data:/var/www/html
      - ./wp-content/plugins/famtastic-reunion-platform:/var/www/html/wp-content/plugins/famtastic-reunion-platform:ro
      - ./wp-content/themes/famtastic-event-cinema:/var/www/html/wp-content/themes/famtastic-event-cinema:ro
      - ../frontend/assets:/var/www/html/assets:ro

  cron:
    image: wordpress:cli-php8.3
    restart: unless-stopped
    depends_on:
      - wordpress
    user: "33:33"
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do wp cron event run --due-now --path=/var/www/html || true; sleep 60; done"]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-mbsh_reunion}
      WORDPRESS_DB_USER: ${WP_DB_USER:-mbsh_local}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-change-local-only}
    volumes:
      - mbsh_wp_data:/var/www/html
      - ./wp-content/plugins/famtastic-reunion-platform:/var/www/html/wp-content/plugins/famtastic-reunion-platform:ro
      - ./wp-content/themes/famtastic-event-cinema:/var/www/html/wp-content/themes/famtastic-event-cinema:ro
      - ../frontend/assets:/var/www/html/assets:ro

volumes:
  mbsh_wp_db:
  mbsh_wp_data:
